<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Signature Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('pages.index') }}"><i class="fas fa-lock"></i> BTC Sig Analyzer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.transaction_page') }}">Transaction Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.address_page') }}">Address Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.ecdsa_analysis_page') }}">ECDSA Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.standalone_calculator_page') }}">Offline Calculator</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">{% block content %}{% endblock %}</main>

    <footer class="footer mt-5 py-3 bg-dark"><div class="container text-center"><span class="text-muted">Bitcoin Signature Analysis Tool</span></div></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/bignum.js') }}"></script>
    <script src="{{ url_for('static', filename='js/gfp.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ec.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bccurve.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ecdsa.js') }}"></script>
    <script src="{{ url_for('static', filename='js/validator.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main-controller.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
